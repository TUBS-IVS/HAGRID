    <text x="66" y="398" fill="#80f2c4" font-size="13" font-weight="700" letter-spacing="2">DEMAND</text>
    <text x="185" y="398" fill="#5a7187" font-size="16">/</text>
    <text x="215" y="398" fill="#80f2c4" font-size="13" font-weight="700" letter-spacing="2">ROUTING</text>
    <text x="344" y="398" fill="#5a7187" font-size="16">/</text>
    <text x="374" y="398" fill="#80f2c4" font-size="13" font-weight="700" letter-spacing="2">TRANSPORT RESEARCH</text>
    <text x="66" y="457" fill="#8198ad" font-size="13">TU BRAUNSCHWEIG · INSTITUTE OF TRANSPORTATION AND URBAN ENGINEERING</text>
    <text x="1374" y="465" fill="#8198ad" font-size="11" text-anchor="end" letter-spacing="1">SCHEMATIC NETWORK</text>

  </g>
  <g fill="none" stroke="url(#route)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M943 324L972 240 1060 218 1092 141 1012 76 926 93 889 164 996 153 1092 141 1181 171 1157 249 1235 234 1272 156 1200 80 1360 91"/>
    <path d="M943 324L1018 411 1114 371 1145 294 1231 333 1201 412 1280 401 1324 318 1235 234"/>
  </g>
  <g fill="#ffc575" stroke="#0d1a29" stroke-width="4">
    <circle cx="926" cy="93" r="7"/><circle cx="1028" cy="89" r="7"/>
    <circle cx="902" cy="140" r="7"/><circle cx="1046" cy="147" r="7"/>
    <circle cx="1170" cy="205" r="7"/><circle cx="1260" cy="182" r="7"/>
    <circle cx="1301" cy="87" r="7"/><circle cx="974" cy="360" r="7"/>
    <circle cx="1068" cy="391" r="7"/><circle cx="1129" cy="334" r="7"/>
    <circle cx="1215" cy="375" r="7"/><circle cx="1303" cy="358" r="7"/>
  </g>
  <rect x="930" y="311" width="26" height="26" rx="6" fill="#80f2c4" stroke="#0d1a29" stroke-width="4"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="64" y="54" width="222" height="32" rx="16" fill="#173b3d"/>
    <text x="175" y="75" fill="#9cf3d4" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">RESEARCH INTO MOTION</text>
    <text x="60" y="211" fill="#f4f8fc" font-size="116" font-weight="750" letter-spacing="-5">HAGRID</text>
    <rect x="535" y="144" width="92" height="59" rx="14" fill="#80f2c4"/>
    <text x="581" y="184" fill="#10232d" font-size="34" font-weight="750" text-anchor="middle">2.0</text>
    <text x="66" y="271" fill="#e0eaf3" font-size="30" font-weight="400">From parcel demand to delivery routes.</text>
    <text x="66" y="312" fill="#9aafc4" font-size="19">Street-aware planning. A shared research pipeline.</text>

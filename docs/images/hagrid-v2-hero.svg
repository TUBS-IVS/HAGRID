<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title description">
  <title id="title">HAGRID 2.0 — From parcel demand to delivery routes</title>
  <desc id="description">A schematic street network with cyan delivery routes and amber stops accompanies the HAGRID title. Demand modelling, route optimisation and transport research at TU Braunschweig. The network is decorative, not a measured tour.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101e32"/>
      <stop offset="1" stop-color="#07131f"/>
    </linearGradient>
    <linearGradient id="route" x2="1" y2="1">
      <stop stop-color="#80f2c4"/>
      <stop offset="1" stop-color="#43c5ed"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b6d7ed" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1440" height="500" rx="20" fill="url(#background)"/>
  <rect width="1440" height="500" rx="20" fill="url(#grid)"/>
  <g fill="none" stroke="#284057" stroke-width="2">
    <path d="M854 18L926 93 889 164 972 240 943 324 1018 411 990 500M1031 0L1012 76 1092 141 1060 218 1145 294 1114 371 1193 450 1174 500M1237 0L1200 80 1272 156 1235 234 1324 318 1280 401 1366 485M1394 0L1360 91 1433 170"/>

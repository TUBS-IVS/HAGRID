# HAGRID-owned section routing; opt in with the runner's -Dhagrid.config property.
# Requires a fresh demand export with hagrid-section-inputs.json beside the demand shapefile.
# HOME uses verified street approaches; registered OOH retains its fixed original link.
routing.sectionHagridInputs=auto
routing.sectionMaxSpanMeters=200
routing.sectionAllowStreetCrossing=false
routing.sectionUnknownTurnPolicy=NETWORK_REVERSAL
# Use the Python environment containing the installed hagrid-demand dependencies:
# routing.sectionEvidencePython=python
# routing.sectionEvidenceTimeoutSeconds=120

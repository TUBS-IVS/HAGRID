<style>

  --c-amazon:#eb6834;--c-hermes:#1baf7a;--c-dhl:#eda100;--c-ups:#e87ba4;--c-gls:#008300;--c-fedex:#4a3aa7;--c-dpd:#e34948;--all:#2a78d6;

  --ink:#f2f5f9;--ink-2:#c3cad5;--muted:#8f99a8;--grid:#232b38;--axis:#3a4453;
  --line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.2);--band:rgba(96,140,230,.12);--band-strong:rgba(96,140,230,.2);
  --primary:#7aa2f7;--on-primary:#0b0f16;--focus:#7aa2f7;--deemph:#3a4453;--closed:#1d2431;
  --c-amazon:#d95926;--c-hermes:#199e70;--c-dhl:#c98500;--c-ups:#d55181;--c-gls:#008300;--c-fedex:#9085e9;--c-dpd:#e66767;--all:#3987e5;
  --q1:#104281;--q2:#1c5cab;--q3:#2a78d6;--q4:#5598e7;--q5:#86b6ef;--q6:#b7d3f6;--good:#0ca30c;--bad:#f07f78;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0b0f16;--surface:#141a24;--surface-2:#1b2230;--surface-3:#252e3e;
  --ink:#f2f5f9;--ink-2:#c3cad5;--muted:#8f99a8;--grid:#232b38;--axis:#3a4453;
  --line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.2);--band:rgba(96,140,230,.12);--band-strong:rgba(96,140,230,.2);
  --primary:#7aa2f7;--on-primary:#0b0f16;--focus:#7aa2f7;--deemph:#3a4453;--closed:#1d2431;
  --c-amazon:#d95926;--c-hermes:#199e70;--c-dhl:#c98500;--c-ups:#d55181;--c-gls:#008300;--c-fedex:#9085e9;--c-dpd:#e66767;--all:#3987e5;
  --q1:#104281;--q2:#1c5cab;--q3:#2a78d6;--q4:#5598e7;--q5:#86b6ef;--q6:#b7d3f6;--good:#0ca30c;--bad:#f07f78;}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.page{max-width:1400px;margin:0 auto;padding-inline:clamp(16px,3vw,36px);padding-block:24px 56px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.mast{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px 36px;align-items:end;padding-bottom:20px}
.eyebrow{font:500 12px/1.4 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);margin:0 0 12px}
h1{font:700 clamp(32px,4.6vw,56px)/1.02 var(--sans);letter-spacing:-.02em;margin:0;text-wrap:balance}
.lede{max-width:64ch;color:var(--ink-2);font-size:16.5px;margin:14px 0 0;text-wrap:pretty}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.facts div{background:var(--surface);padding:10px 14px}
.facts dt{font:500 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 2px}
.facts dd{margin:0;font-size:19px;font-weight:600;white-space:nowrap}
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin-inline:calc(-1*clamp(16px,3vw,36px));padding:10px clamp(16px,3vw,36px);background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-block:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.ctl{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.ctl-l{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:transparent;padding:8px 12px;min-height:36px;border-radius:6px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.08)}
.nav{display:inline-flex;align-items:center;gap:6px}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.icon:hover{border-color:var(--line-strong)}
.icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.sel-label{font-weight:600;font-size:14px;min-width:12ch}
.chips{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:1px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 11px 7px 9px;min-height:36px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.section{padding-top:36px;scroll-margin-top:90px}
h2{font:700 clamp(22px,2.4vw,28px)/1.15 var(--sans);letter-spacing:-.01em;margin:0 0 6px}
.finding{margin:0 0 14px;max-width:80ch;color:var(--ink-2)}
.finding b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s5{grid-column:span 5}.s4{grid-column:span 4}
@media (max-width:1060px){.grid>*{grid-column:span 12!important}}
.panel{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.fig-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:8px}
h3{font-size:15.5px;font-weight:600;margin:0}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.cap{color:var(--muted);font-size:12.5px;margin:8px 0 0;max-width:100ch}
.scroll-x{overflow-x:auto;overflow-y:hidden}
.chart svg{display:block;overflow:visible}
svg text{font-family:var(--sans);fill:var(--muted);font-size:11.5px}
svg .tick{font-family:var(--mono);font-size:10.5px}
svg .lbl{fill:var(--ink-2);font-size:12px}
svg .lbl-b{fill:var(--ink);font-size:12px;font-weight:600}
svg .val{fill:var(--ink);font-size:11.5px;font-weight:600}
svg .gl{stroke:var(--grid);stroke-width:1}
svg .ax{stroke:var(--axis);stroke-width:1}
svg .hit{fill:transparent;cursor:pointer}
.cal-cell{cursor:pointer;transition:opacity .15s}
.cal-cell:hover{stroke:var(--ink);stroke-width:1.5}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2);margin:0 0 6px}
.legend button,.legend span.li{border:0;background:none;padding:2px 0;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;color:inherit}
.legend span.li{cursor:default}
.lk{display:inline-block;width:14px;height:2px;border-radius:1px}
.kpis{display:grid;grid-template-columns:1.5fr repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;min-width:0}
.kpi p{margin:0 0 4px;font-size:12.5px;color:var(--ink-2)}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.kpi .v small{font-size:13px;color:var(--ink-2);font-weight:500;margin-left:3px}
.kpi .d{font-size:12.5px;color:var(--muted);margin-top:3px}
.kpi.hero .v{font-size:clamp(36px,4vw,50px);font-weight:700;line-height:1.05}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi.hero{grid-column:span 3}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi.hero{grid-column:span 2}.mast{grid-template-columns:1fr}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.scale{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px;color:var(--ink-2);margin-top:6px}
.bins{display:flex;gap:2px}.bins span{display:flex;flex-direction:column;gap:3px;min-width:42px;font:10.5px var(--mono);color:var(--muted)}.bins i{height:9px;border-radius:2px;display:block}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:9px;max-height:460px}
.tbl.free{max-height:none}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--surface-2);text-align:right;font-weight:600;color:var(--ink-2);padding:0;white-space:nowrap;border-bottom:1px solid var(--line);font-size:12px}
th button{border:0;background:none;width:100%;text-align:inherit;padding:8px 10px;cursor:pointer;font:inherit;color:inherit}
td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-family:var(--mono);font-size:12.5px}
th.l,td.l{text-align:left;font-family:var(--sans)}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--band)}tbody tr.on td{background:var(--band-strong)}
.bar-i{display:inline-block;height:8px;border-radius:2px;vertical-align:middle;margin-left:8px}
.map-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1060px){.map-wrap{grid-template-columns:1fr}}
.select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:36px;font:inherit;font-size:13px;color:var(--ink)}
#map-svg path.plz{stroke:var(--surface);stroke-width:1;cursor:pointer}
#map-svg path.plz:hover,#map-svg path.plz.on{stroke:var(--ink);stroke-width:1.8}
.card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px;position:sticky;top:100px}
.card .code{font:500 28px/1 var(--mono)}.card .name{color:var(--ink-2);margin-top:4px}
.card dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:12px 0}.card dt{font-size:11.5px;color:var(--muted);margin:0}.card dd{margin:0;font-weight:600;font-family:var(--mono)}
.mix{display:grid;gap:3px}.mix div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:7px;padding:8px 10px;margin-top:8px}
.list{margin:6px 0 0;padding-left:18px;color:var(--ink-2);line-height:1.6}.list b{color:var(--ink)}
footer{margin-top:44px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.tip{position:fixed;z-index:60;left:0;top:0;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);box-shadow:0 14px 34px -14px rgba(0,0,0,.45);border-radius:9px;padding:9px 11px;font-size:12.5px;min-width:180px;max-width:300px}
.tip strong{display:block;font-size:13px}.tip .s{color:var(--muted);font-size:11.5px;margin-bottom:5px;display:block}
.tr{display:grid;grid-template-columns:12px minmax(52px,auto) 1fr;gap:0 8px;align-items:center;line-height:1.6}
.tr b{font-family:var(--mono);font-weight:500;text-align:right}.tr span{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tr i{width:12px;height:2px;display:block;border-radius:1px}
</style>

<script id="hagrid-annual" type="application/json">__HAGRID_ANNUAL_DATA__</script>

<div class="page">
  <header class="mast">
    <div>
      <p class="eyebrow">HAGRID parcel demand · run <span id="run-id"></span> · year <span id="year"></span></p>
      <h1>Hannover Parcel Year</h1>
      <p class="lede" id="lede"></p>
    </div>
    <dl class="facts" id="facts"></dl>
  </header>

  <div class="controls" role="toolbar" aria-label="Selection for all views">
    <div class="ctl"><span class="ctl-l" id="l-mode">View</span><div class="seg" id="ctl-mode" role="group" aria-labelledby="l-mode"></div></div>
    <div class="ctl nav">
      <button class="icon" id="prev" type="button" aria-label="Previous period"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span class="sel-label" id="sel-label" aria-live="polite"></span>
      <button class="icon" id="next" type="button" aria-label="Next period"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="ctl"><span class="ctl-l" id="l-seg">Segment</span><div class="seg" id="ctl-seg" role="group" aria-labelledby="l-seg"></div></div>
    <div class="ctl"><span class="ctl-l" id="l-car">Carrier</span><div class="chips" id="ctl-car" role="group" aria-labelledby="l-car"></div></div>
  </div>

  <section class="section" id="calendar" aria-labelledby="h-cal">
    <h2 id="h-cal">Calendar</h2>
    <p class="finding" id="f-cal"></p>
    <figure class="panel">
      <div class="fig-head"><div><h3>Parcels per day</h3><p class="sub" id="s-cal"></p></div></div>
      <div class="scroll-x"><div class="chart" id="ch-cal" tabindex="0" role="application" aria-label="Year calendar. Arrow keys move the selected day, Enter keeps it."></div></div>
      <div class="scale" id="sc-cal"></div>
      <p class="cap">Click a day to select it in the current view (day, ISO week or month); click a month name to select the month. Arrow keys move the selection. Grey: Sundays and public holidays in Lower Saxony (no deliveries); a dot marks a holiday.</p>
    </figure>
  </section>

  <section class="section" id="overview" aria-labelledby="h-ov">
    <h2 id="h-ov">Selected period</h2>
    <div class="kpis" id="kpis"></div>
    <div class="grid" style="margin-top:16px">
      <figure class="panel s8">
        <div class="fig-head"><div><h3>Parcels over the year by carrier</h3><p class="sub" id="s-ts"></p></div>
          <div class="seg" id="ctl-gran" role="group" aria-label="Time resolution"></div></div>
        <div class="legend" id="lg-ts"></div>
        <div class="chart" id="ch-ts"></div>
        <p class="cap">Stacked from the bottom: Amazon, Hermes, DHL, UPS, GLS, FedEx/TNT, DPD. The band marks the selected period; hover for the breakdown.</p>
      </figure>
      <figure class="panel s4">
        <div class="fig-head"><div><h3>Weekday profile</h3><p class="sub" id="s-wd"></p></div></div>
        <div class="legend" id="lg-wd"></div>
        <div class="chart" id="ch-wd"></div>
        <p class="cap" id="cap-wd"></p>
      </figure>
    </div>
  </section>

  <section class="section" id="carriers" aria-labelledby="h-car">
    <h2 id="h-car">Carriers</h2>
    <p class="finding" id="f-car"></p>
    <figure class="panel"><div id="car-table"></div>
      <p class="cap">Monday and Saturday: share of the carrier's parcels in the selected period that are delivered on that weekday. B2B-heavy carriers deliver less on Saturdays because only about one firm in five is open.</p></figure>
  </section>

  <section class="section" id="map" aria-labelledby="h-map">
    <h2 id="h-map">Where the parcels arrive</h2>
    <div class="map-wrap">
      <figure class="panel" style="min-width:0">
        <div class="fig-head"><div><h3 id="t-map">Postcode areas</h3><p class="sub" id="s-map"></p></div>
          <label><span class="ctl-l" style="margin-right:6px">Indicator</span><select class="select" id="ctl-metric"></select></label></div>
        <div class="chart" id="ch-map"></div>
        <div class="scale" id="sc-map"></div>
        <p class="cap">Postcode areas © OpenStreetMap contributors (ODbL). District names are for orientation only.</p>
      </figure>
      <aside class="card" id="plz-card" aria-live="polite"></aside>
    </div>
    <figure class="panel" style="margin-top:16px"><div class="fig-head"><div><h3>All postcode areas</h3><p class="sub" id="s-plz"></p></div></div><div id="plz-table"></div></figure>
  </section>

  <section class="section" id="method" aria-labelledby="h-me">
    <h2 id="h-me">How the days are generated</h2>
    <figure class="panel"><ol class="list" id="method-list"></ol></figure>
  </section>

  <footer><span id="foot"></span><span>Maps and buildings © OpenStreetMap contributors (ODbL) · calibrated to DHL street volumes 2021</span></footer>
</div>
<div class="tip" id="tip" role="tooltip" hidden></div>

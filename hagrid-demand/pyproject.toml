[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hagrid-demand"
version = "0.1.0"
description = "Traceable parcel demand data foundation"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "geopandas>=1.0,<2", "shapely>=2.0,<3", "pyogrio>=0.9,<1", "pyarrow>=14", "scipy>=1.13,<2", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "scikit-learn>=1.7,<2", "threadpoolctl>=3,<4"]
research = ["scikit-learn>=1.7,<2", "threadpoolctl>=3,<4"]

[project.scripts]
hagrid-demand = "hagrid_demand.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hagrid_demand", "hagrid_demand.*"]

[tool.setuptools.package-data]
hagrid_demand = ["dashboard.html", "spatial.html", "model.html", "baseline/data/*.json", "experimental/*.html", "experimental/*.json", "baseline/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

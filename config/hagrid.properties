# HAGRID: gemeinsame Konfiguration (UTF-8).
# Aktiv: geprüfte gemeinsame Standards. # = optionales Beispiel / Profil erben.
# Dateipfade relativ zu dieser Datei; explizite CLI-Pfade relativ zum Arbeitsverzeichnis.
# Verwendung: config=config/hagrid.properties,concept=basecase,date=2025-05-13

# 1. Lauf / MATSim (Identität besser je Start angeben)
# run.concept=basecase
# run.date=2025-05-13
# run.tag=meinVersuch
# run.studyArea=HANNOVER
# Ein gemeinsamer Seed für MATSim, jsprit, Bedarf, Fahrzeuge, Supply, LMD und Shared Use.
# Benannte unabhängige Zufallsströme werden daraus abgeleitet; der Tag beeinflusst sie nicht.
run.seed=1337
# Exportierte Ableitung: randomSeeds.algorithmVersion=sha256-length-prefixed-v1 (nicht umstellbar).
# simulation.maxIterations=150
# simulation.jspritIterations=100
simulation.overwriteCompletedRun=false
results.writeDashboard=false
results.kpiDashboard=true
# results.eventsWriteInterval=1
# results.plansWriteInterval=1
results.freightHistogramWriteInterval=1

# 2. Gemeinsame Tourregel: Bedarf, Solver, Scoring, Fahrzeugfenster, Cache
tourRules.maxRouteDurationSeconds=25200
tourRules.vehicleAvailabilityBufferSeconds=3600
tourRules.vehicleDayEndSeconds=75600
tourRules.durationPerParcelSeconds=120
tourRules.maxDurationPerStopSeconds=900
# Separate native Sicherheitsgrenze; die obige Tourgrenze begrenzt weiterhin auf 7h.
tourRules.maxDriverTimeSeconds=36000
# Tageszeitfenster je Profil erben: Hannover 08-20, Lausitz 07:30-21.
# tourRules.deliveryWindowStartSeconds=28800
# tourRules.deliveryWindowEndSeconds=72000
# tourRules.uTurnPenaltyCost=1
scoring.activityCostPerSecond=0.008
scoring.timeWindowPenaltyPerSecond=5
scoring.overtimePenalty=5

# 3. Suche / exakter Cache (Hannover-Schedule nicht anderen Profilen aufzwingen)
# Construct initial tours without improvement search; replanning has its own budget.
optimization.initialIterations=0
# optimization.replanningIterations=100
# optimization.offlineIterations=100
# optimization.replanningStartIteration=25
# optimization.carriersPerGroup=16
# routing.isUsingZones=true
routing.transportCacheEnabled=true
routing.maximumCacheEntries=100000
routing.maximumConcurrentRouters=1
routing.odTimeQuantizationSeconds=0
results.carrierPlanCacheEnabled=true
# results.carrierPlanCacheDirectory=../my-cache

# 4. Ressourcen: während Vroom kleine, serielle eigene Prüfungen verwenden.
# Dies konfiguriert Produkt-Solver; JVM-Heap und 6-GiB-Prüfschutz steuert ResourceGuard.
resources.internalSolverThreads=1
resources.maxActiveSolvers=1

# 5. Fahrzeuge / Hannover-Abfahrten (XML bestimmt Typen und Kapazitäten)
fleet.cargoBikeMaxSpeedKmh=20
fleet.largeDispatchJitterMinutes=5
fleet.defaultDispatchJitterMinutes=15
# fleet.activeSizes=m,l
# fleet.defaultDispatchHours=7,14
# fleet.providerSizes.dhl=m,l
# fleet.providerDispatchHours.dhl=7,14
# fleet.providerTimeShiftHours.dhl=0

# 6. Bedarf / Anbieter / Hubs / Netzfilter (vor der Bedarfserzeugung laden)
# HANNOVER selects the city; ALL selects the complete demand area.
# demand.filterRegions=ALL
# demand.demandBorder=500
# demand.dhlBorder=450
# demand.carrierMergeThreshold=100
# providers.shapefileProviders=dhl_tag,gls_tag,hermes_tag,dpd_tag,ups_tag,amazon_tag,fedex_tag
# providers.locationProviders=dhl,gls,hermes,dpd,ups,amazon,fedex
# providers.deliveryRates.dhl=94
# providers.deliveryRates.gls=91
# hubs.limitDHL=500
# hubs.limitPost=500
# hubs.parcelLockerDemand=15
# hubs.parcelLockerDurationMinutes=5
# hubs.fixedParcelLockerDemand=false
# Explicit false for calendar demand without extra fixed locker demand.
# hubs.loadLegacyLocations=true
# network.minLinkLengthMeters=5
# network.minFreeSpeedMps=2.777778
# network.freeSpeedThresholdMps=17

# 7. Supply: alle Zeiten ab Mitternacht, Streuungen hier in Sekunden.
supply.vehicleCapacity=2000
supply.durationPerStopSeconds=1800
supply.earlyStartSeconds=21600
supply.earlyEndSeconds=27900
supply.lateStartSeconds=72000
supply.lateEndSeconds=86400
supply.earlyDispatchJitterSeconds=10
supply.lateDispatchJitterSeconds=20
# supply.baselineCarriersFile=../data/carrierPlans_Supply.xml
# supply.linkDirections.south=2847279
# supply.directionProbabilities.south=0.25

# 8. Lausitz LMD: Wellen, Kopien, reproduzierbare Zufallsströme, Zustellquoten
lmd.dispatchHours=8,14
lmd.waveVehicleCopies=4
# LMD-Zufallswerte erben run.seed.
lmd.dhlDailyBiasPercent=2.5
lmd.defaultDailyBiasPercent=5
lmd.fallbackDeliveryRatePercent=90
lmd.b2bDeliveryRatePercent=99
lmd.maximumEffectiveDeliveryRatePercent=98

# 9. DRT: nur bei DRT wirksam; native Strategieparameter bleiben profilabhängig.
# drt.fleetSize=50
# freight.enabled=true
drt.baseSeats=10
drt.stopDurationSeconds=60
drt.maxWaitTimeSeconds=1200
drt.maxTravelTimeAlpha=1.5
drt.maxTravelTimeBetaSeconds=1200
drt.zoneCellSizeMeters=2000
drt.rebalancingIntervalSeconds=1800
drt.demandEstimationPeriodSeconds=1800
drt.requestRetryIntervalSeconds=300
drt.maxRequestAgeSeconds=86400
drt.serviceBeginSeconds=0
drt.serviceEndSeconds=86400
drt.returnWindowSeconds=5400
drt.depotArrivalIntervalSeconds=1800
drt.intermodalRadiusMeters=50000
drt.intermodalSearchExtensionMeters=1000
drt.rideScoringFactor=2
drt.teleportedPtSpeedKmh=50
drt.teleportedPtBeelineFactor=1.3
drt.ptFareDeflation=1.16
# drt.fareZoneFile=../data/tarifzone.shp

# 10. Shared-Use: Paketregeln werden nur im aktiven Shared-Use-Profil geprüft.
sharedUse.seats=8
sharedUse.parcelSlots=20
sharedUse.depotLoadPerParcelSeconds=30
sharedUse.maxPickupDurationSeconds=600
sharedUse.submitUntilSeconds=36000
# Shared-Use-Pakete erben run.seed.
# sharedUse.chiThresholdSeconds=600
# sharedUse.noParcels=false

# 11. Modular: dieselbe Tourgrenze aus Abschnitt 2; Umschlagzeiten separat.
modular.retoolingSeconds=420
modular.freightLookAheadSeconds=420
modular.chainBootstrapFactor=1.15
# modular.idleThreshold=0.1
# modular.openDepots=all
# modular.maxJobsPerDistrict=300
# modular.maxConcurrentFreight=0
# modular.freightWindows=07:00-13:00,16:45-18:30
# modular.budgetMode=off
# modular.budgetSmoothing=900
# modular.budgetHeadroom=0.1
# modular.budgetUrgencyLeadSeconds=420


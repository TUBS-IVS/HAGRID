# HAGRID V2: one demand + jsprit run; NO MATSim launch or simulation script.
# Main class: hagrid.hannover.HagridV2RoutingRunner
# Program argument: config/hagrid2-sections.properties (from repository root)
# Standalone profile: not layered on top of config/hagrid.properties.
run.concept=basecase
run.date=2025-05-13
run.tag=v2
demand.filterRegions=Hannover

# Fresh HAGRID Python export required: hagrid-section-inputs.json,
# section_stops.parquet, section_streets.parquet beside freight demand.
# Uses only HAGRID data; original service times/windows remain unchanged.
routing.sectionHagridInputs=auto

# Maximum grouping span along a street (metres), NOT distance between customers.
# 200 m is a working default, not a calibrated optimum.
routing.sectionMaxSpanMeters=200

# false: serve customer side; true: opposite-side stopping/crossing is allowed.
# Only verified legal network directions are candidates. No walking-time model.
routing.sectionAllowStreetCrossing=false

# Uncertain reversals stay UNKNOWN and traversable with the configured soft cost.
routing.sectionUnknownTurnPolicy=NETWORK_REVERSAL

# Additive generalized cost per U-turn, NOT seconds and NOT a prohibition.
# 0.1 is a trial setting, not a validated real-world calibration.
tourRules.uTurnPenaltyCost=0.1

# Actual initial jsprit search and offline section search budget.
optimization.initialIterations=100
optimization.offlineIterations=100

# Python executable must have the HAGRID demand package/dependencies installed.
# routing.sectionEvidencePython=python
# routing.sectionEvidenceTimeoutSeconds=120

